<style>
/* Layout: una schedina da bar. Fondo azzurro a puntini, carte bianche a bordo pieno con ombra dura, intestazioni scure da tagliando. */
:root {
  --bg: #cfe9fb;
  --dot: rgba(11, 26, 46, .09);
  --surface: #ffffff;
  --surface-2: #e6f3fd;
  --ink: #0b1a2e;
  --muted: #475b73;
  --line: #a6c4de;
  --edge: #0b1a2e;
  --shade: #0b1a2e;
  --head-bg: #0b1a2e;
  --head-ink: #ffffff;
  --azzurro: #1a9be8;
  --azzurro-ink: #07192b;
  --giallo: #ffd23f;
  --giallo-ink: #1a1400;
  --ok: #17895a;
  --bad: #d23b3b;
  --chip-ok-bg: #17895a; --chip-ok-ink: #ffffff; --chip-ko-bg: #d23b3b; --chip-ko-ink: #ffffff;
  --font-display: "Bungee", Impact, "Arial Black", sans-serif;
  --font-label: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07111e; --dot: rgba(120, 190, 245, .08); --surface: #10243a; --surface-2: #183250; --ink: #eef6fd; --muted: #98b0c8;
    --line: #2d4e72; --edge: #5fb4f2; --shade: #020810; --head-bg: #1b4a75; --head-ink: #ffffff;
    --azzurro: #38a9f2; --azzurro-ink: #06182a; --giallo: #ffd23f; --giallo-ink: #1a1400; --ok: #3ccf8e; --bad: #f07272;
    --chip-ok-bg: #3ccf8e; --chip-ok-ink: #05281a; --chip-ko-bg: #f07272; --chip-ko-ink: #2a0707;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07111e; --dot: rgba(120, 190, 245, .08); --surface: #10243a; --surface-2: #183250; --ink: #eef6fd; --muted: #98b0c8;
  --line: #2d4e72; --edge: #5fb4f2; --shade: #020810; --head-bg: #1b4a75; --head-ink: #ffffff;
  --azzurro: #38a9f2; --azzurro-ink: #06182a; --giallo: #ffd23f; --giallo-ink: #1a1400; --ok: #3ccf8e; --bad: #f07272;
  --chip-ok-bg: #3ccf8e; --chip-ok-ink: #05281a; --chip-ko-bg: #f07272; --chip-ko-ink: #2a0707;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background-color: var(--bg); color: var(--ink);
  background-image: radial-gradient(var(--dot) 1.3px, transparent 1.4px); background-size: 15px 15px;
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--giallo); outline-offset: 2px; }
[hidden] { display: none !important; }

header.top { padding: 22px 0 14px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.55rem; line-height: 1.08; text-wrap: balance; color: var(--ink); text-shadow: 3px 3px 0 var(--azzurro); letter-spacing: .01em; }
.sub { margin: 8px 0 0; color: var(--muted); font-family: var(--font-label); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; }
.stripe { height: 10px; margin: 0 0 18px; border: 2px solid var(--edge); border-radius: 6px; background: repeating-linear-gradient(-45deg, var(--azzurro) 0 9px, var(--surface) 9px 18px); }
.who { font-family: var(--font-label); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: .75rem; color: var(--muted); text-align: right; min-width: 0; }
.who button { display: block; margin-left: auto; background: none; border: 0; padding: 4px 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-family: var(--font-label); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: .75rem; }
.who span { display: block; overflow-wrap: anywhere; color: var(--ink); }

/* login */
.login { background: var(--surface); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 6px 6px 0 var(--shade); padding: 20px; display: grid; gap: 14px; margin-top: 10px; }
.login::before { content: "Tessera giocatore \00b7\00a0 Serie A 26/27"; font-family: var(--font-label); font-weight: 600; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 2px dashed var(--line); }
.login h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; text-transform: uppercase; }
.login p { margin: 0; color: var(--muted); font-size: .95rem; }
label { display: grid; gap: 6px; font-family: var(--font-label); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: .72rem; color: var(--muted); }
input[type=text], input[type=password], input[type=tel] {
  font: inherit; font-size: 1.1rem; font-weight: 500; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--edge);
  background: var(--surface-2); color: var(--ink); width: 100%; text-transform: none; letter-spacing: normal;
}
.btn { background: var(--azzurro); color: var(--azzurro-ink); border: 2px solid var(--edge); border-radius: 12px; box-shadow: 4px 4px 0 var(--shade); padding: 13px 16px; font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .04em; transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--shade); }
.btn:disabled { opacity: .6; cursor: default; }
.err { color: var(--bad); font-size: .92rem; min-height: 1.2em; margin: 0; font-weight: 500; }
.logo { display: block; width: 100%; max-width: 280px; height: auto; margin: 0 auto; }

/* navigation */
nav.md { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
nav.md .step { width: 46px; height: 46px; border-radius: 12px; border: 2px solid var(--edge); background: var(--surface); box-shadow: 3px 3px 0 var(--shade); font-size: 1.4rem; line-height: 1; font-weight: 700; transition: transform .08s, box-shadow .08s; }
nav.md .step:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shade); }
nav.md .step:disabled { opacity: .35; cursor: default; box-shadow: none; }
nav.md .title { flex: 1; text-align: center; font-family: var(--font-display); line-height: 1; min-width: 0; }
nav.md .md-l { display: block; font-family: var(--font-label); font-weight: 600; font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
nav.md .md-n { font-size: 2.6rem; color: var(--ink); text-shadow: 3px 3px 0 var(--giallo); }
nav.md .title small { display: block; margin-top: 6px; font-family: var(--font-label); font-weight: 500; font-size: .72rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.tabs { display: grid; grid-template-columns: repeat(2, 1fr); background: var(--surface); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 4px 4px 0 var(--shade); padding: 4px; gap: 4px; margin: 0 4px 18px 0; }
.tabs button { background: none; border: 0; padding: 10px; border-radius: 9px; font-family: var(--font-display); font-weight: 400; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.tabs button[aria-selected=true] { background: var(--azzurro); color: var(--azzurro-ink); }

/* selezione partite */
.progress { margin: 0 0 10px; font-family: var(--font-label); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: .74rem; color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; margin: 0 5px 20px 0; }
.mchip { border: 2px solid var(--edge); border-radius: 12px; box-shadow: 3px 3px 0 var(--shade); padding: 9px 10px 8px; text-align: left; display: grid; gap: 4px; min-width: 0; background: var(--chip-ko-bg); color: var(--chip-ko-ink); transition: transform .08s, box-shadow .08s; }
.mchip.ok { background: var(--chip-ok-bg); color: var(--chip-ok-ink); }
.mchip b { font-family: var(--font-display); font-weight: 400; font-size: .8rem; text-transform: uppercase; letter-spacing: .01em; line-height: 1.15; overflow-wrap: anywhere; }
.mchip small { font-family: var(--font-label); font-weight: 600; font-size: .66rem; letter-spacing: .04em; text-transform: uppercase; }
.mchip[aria-pressed=true] { outline: 3px solid var(--giallo); outline-offset: 2px; transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shade); }

/* match card */
.card { background: var(--surface); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 6px 6px 0 var(--shade); padding: 14px; display: grid; gap: 14px; min-width: 0; overflow: hidden; margin-right: 6px; }
.when { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: -14px -14px 0; padding: 10px 14px; background: var(--head-bg); color: var(--head-ink); font-family: var(--font-label); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; }
.pill { border-radius: 999px; padding: 2px 10px; background: var(--surface-2); color: var(--ink); font-weight: 600; }
.pill.live { background: var(--giallo); color: var(--giallo-ink); }
.pill.done { background: var(--ok); color: #fff; }
.score { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 8px; align-items: center; }
.score > .team:first-child { grid-area: 1 / 1; }
.score > .team.away { grid-area: 1 / 2; }
.score > .goals { grid-area: 2 / 1 / 3 / 3; justify-content: center; }
.team { font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; text-transform: uppercase; line-height: 1.1; overflow-wrap: anywhere; min-width: 0; }
.team.away { text-align: right; }
.goals { display: flex; align-items: center; gap: 10px; }
.stepper { display: grid; grid-template-columns: 40px 54px 40px; align-items: center; justify-items: center; gap: 6px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--edge); background: var(--surface-2); box-shadow: 2px 2px 0 var(--shade); font-size: 1.3rem; line-height: 1; font-weight: 700; transition: transform .08s, box-shadow .08s; }
.stepper button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--shade); }
.stepper button:disabled { opacity: .35; cursor: default; box-shadow: none; }
.stepper output { display: grid; place-items: center; width: 54px; height: 54px; border: 2px solid var(--edge); border-radius: 10px; background: var(--bg); font-family: var(--font-display); font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.dash { font-family: var(--font-display); font-size: 1.3rem; color: var(--muted); }
.final { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--giallo); color: var(--giallo-ink); border: 2px solid var(--edge); border-radius: 10px; padding: 8px 12px; font-family: var(--font-label); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: .74rem; }
.final b { font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.q { display: grid; gap: 9px; border-top: 2px dashed var(--line); padding-top: 12px; }
.q p { margin: 0; font-weight: 700; font-size: .98rem; display: flex; justify-content: space-between; gap: 8px; }
.q p em { font-style: normal; font-family: var(--font-label); background: var(--giallo); color: var(--giallo-ink); border-radius: 6px; padding: 1px 7px; font-weight: 600; font-size: .78rem; white-space: nowrap; align-self: flex-start; }
.opts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.opts button { padding: 10px 6px; border-radius: 10px; border: 2px solid var(--edge); background: var(--surface-2); box-shadow: 2px 2px 0 var(--shade); font-weight: 700; font-size: .9rem; overflow-wrap: anywhere; min-width: 0; transition: transform .08s, box-shadow .08s; }
.opts button[aria-pressed=true] { background: var(--azzurro); color: var(--azzurro-ink); transform: translate(2px, 2px); box-shadow: 0 0 0 var(--shade); }
.opts button[aria-pressed=true]::before { content: "\2715\00a0"; font-weight: 700; }
.opts button.right { outline: 3px solid var(--ok); outline-offset: 1px; }
.opts button:disabled { cursor: default; }
.lock { font-family: var(--font-label); font-size: .72rem; letter-spacing: .04em; color: var(--muted); margin: 0; }
.got { font-family: var(--font-label); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ok); font-size: .8rem; background: var(--surface); border-radius: 6px; padding: 1px 7px; }
.got.zero { color: var(--muted); }
details.others { border-top: 2px dashed var(--line); padding-top: 10px; }
details.others summary { cursor: pointer; font-family: var(--font-label); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .76rem; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.others ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; font-size: .92rem; }
.others li { display: flex; justify-content: space-between; gap: 8px; }
.others li span:last-child { color: var(--muted); text-align: right; }

/* leaderboard */
.scope { display: flex; gap: 10px; margin: 0 5px 16px 0; }
.scope button { flex: 1; padding: 10px; border-radius: 12px; border: 2px solid var(--edge); background: var(--surface); box-shadow: 3px 3px 0 var(--shade); font-family: var(--font-display); font-weight: 400; font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; transition: transform .08s, box-shadow .08s; }
.scope button[aria-pressed=true] { background: var(--azzurro); color: var(--azzurro-ink); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shade); }
ol.rank { list-style: none; margin: 0 5px 0 0; padding: 0; display: grid; gap: 12px; }
ol.rank li { background: var(--surface); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 4px 4px 0 var(--shade); padding: 12px 14px; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
ol.rank li.me { background: var(--giallo); color: var(--giallo-ink); }
ol.rank .pos { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--edge); background: var(--surface-2); color: var(--ink); font-family: var(--font-display); font-size: 1.15rem; }
ol.rank li:nth-child(1) .pos { background: var(--giallo); color: var(--giallo-ink); }
ol.rank li.me .pos { background: var(--surface); color: var(--ink); }
ol.rank .nm { font-family: var(--font-display); font-weight: 400; font-size: 1rem; text-transform: uppercase; overflow-wrap: anywhere; line-height: 1.15; }
ol.rank .det { display: block; margin-top: 3px; font-family: var(--font-label); font-weight: 500; text-transform: none; font-size: .7rem; letter-spacing: .02em; color: var(--muted); }
ol.rank li.me .det { color: rgba(26, 20, 0, .72); }
ol.rank .pts { font-family: var(--font-display); font-size: 1.9rem; font-variant-numeric: tabular-nums; line-height: 1; }
.rules { margin: 18px 4px 0 0; font-family: var(--font-label); font-size: .72rem; letter-spacing: .02em; color: var(--muted); line-height: 1.5; }
.rules b { color: var(--ink); text-transform: uppercase; letter-spacing: .08em; }
.empty { text-align: center; padding: 32px 12px; color: var(--muted); background: var(--surface); border: 2px dashed var(--edge); border-radius: 14px; font-weight: 500; }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 999px; font-family: var(--font-label); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast, .btn, .mchip, .opts button, .stepper button, .scope button, nav.md .step { transition: none; } }
@media (max-width: 380px) { h1 { font-size: 1.3rem; } .team { font-size: .95rem; } .stepper { grid-template-columns: 36px 48px 36px; } .stepper button { width: 36px; height: 36px; } .stepper output { width: 48px; height: 48px; } nav.md .md-n { font-size: 2.2rem; } }
</style>
</head>

      <circle cx="173" cy="142" r="12" fill="#ffffff" fill-opacity=".45" stroke="#1b1b1b" stroke-width="3.5"/>
      <path d="M159 141Q160 138 161 141M135 141L126 139M185 141L194 139" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="147" cy="143" r="2.6" fill="#1b1b1b"/>
      <circle cx="173" cy="143" r="2.6" fill="#1b1b1b"/>
      <path d="M160 149Q156 156 162 157" stroke="#c9976f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M146 162Q160 172 174 162" stroke="#7a3b2e" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="139" cy="158" r="5" fill="#e88f86" opacity=".35"/>
      <circle cx="181" cy="158" r="5" fill="#e88f86" opacity=".35"/>
    </svg>
    <form class="login" id="loginForm" autocomplete="off">
      <h2>Entra in gioco</h2>
      <p>Scrivi il tuo nome e scegli un PIN di 4 cifre. La prima volta crei il tuo profilo, poi rientri con gli stessi dati.</p>
      <label for="nameIn">Nome
        <input id="nameIn" type="text" maxlength="24" required autocapitalize="words" placeholder="Es. Giuliano">
      </label>
      <label for="pinIn">PIN (4 cifre)
        <input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required placeholder="••••">
      </label>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn" id="loginBtn" type="submit">Entra</button>
    </form>
  </section>

  <section id="appView" hidden>
    <nav class="md" aria-label="Giornata">
      <button class="step" id="prevMd" type="button" aria-label="Giornata precedente">&#8249;</button>
      <div class="title" id="mdTitle">Giornata</div>
      <button class="step" id="nextMd" type="button" aria-label="Giornata successiva">&#8250;</button>
    </nav>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabPlay" aria-selected="true">Pronostici</button>
      <button type="button" role="tab" id="tabRank" aria-selected="false">Classifica</button>
    </div>
    <div id="playPane"></div>
    <div id="rankPane" hidden></div>
  </section>

  <p class="empty" id="loading">Carico il gioco&hellip;</p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";
  var SB = "https://rjvuhvrjibeutjmfccnz.supabase.co";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqdnVodnJqaWJldXRqbWZjY256Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzU3NDksImV4cCI6MjEwODYxMTc0OX0.UdQUYnghDiuih8sNaWbdkJipM4dkFWIIAhg0ZeL-C-M";
  var HEAD = { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" };

  var $ = function (id) { return document.getElementById(id); };
  var state = { sel: null, me: null, mds: [], md: null, matches: [], preds: {}, ans: {}, revP: [], revA: [], scope: "md", tab: "play" };

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  /* ---------- suoni ---------- */
  // Per usare i tuoi file: metti qui il percorso, per esempio chip: "sounds/pop.mp3". Se resta vuoto suona il suono di base.
  var SOUND_FILES = { up: "", down: "", pick: "", chip: "", done: "", join: "sounds/ingresso.mp3", err: "" };
  var snd = { on: store("ble.snd") !== "0", ctx: null };
  function audioCtx() {
    try {
      if (!snd.ctx) { var C = window.AudioContext || window.webkitAudioContext; if (C) snd.ctx = new C(); }
      if (snd.ctx && snd.ctx.state === "suspended") snd.ctx.resume();
    } catch (e) {}
    return snd.ctx;
  }
  function tone(c, f, at, dur, type, vol, f2) {
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  var SYNTH = {
    up: function (c) { tone(c, 620, 0, .07, "square", .06, 900); },
    down: function (c) { tone(c, 520, 0, .07, "square", .06, 360); },
    pick: function (c) { tone(c, 180, 0, .14, "triangle", .25, 55); tone(c, 900, 0, .03, "square", .04); },
    chip: function (c) { tone(c, 440, 0, .06, "sine", .15, 660); },
    done: function (c) { [523, 659, 784, 1047].forEach(function (f, i) { tone(c, f, i * .085, .14, "square", .06); }); },
    join: function (c) { [392, 523, 659, 784].forEach(function (f, i) { tone(c, f, i * .11, .22, "triangle", .16); }); },
    err: function (c) { tone(c, 170, 0, .28, "sawtooth", .07, 105); }
  };
  function play(name) {
    if (!snd.on) return;
    try {
      if (SOUND_FILES[name]) { var a = new Audio(SOUND_FILES[name]); a.volume = .85; a.play().catch(function () {}); return; }
      var c = audioCtx(); if (c && SYNTH[name]) SYNTH[name](c);
    } catch (e) {}
  }
  function paintSnd() { var b = $("sndBtn"); b.textContent = "Suoni: " + (snd.on ? "sì" : "no"); b.setAttribute("aria-pressed", snd.on ? "true" : "false"); }
  $("sndBtn").addEventListener("click", function () { snd.on = !snd.on; store("ble.snd", snd.on ? "1" : "0"); paintSnd(); if (snd.on) play("chip"); });
  paintSnd();

  function api(path, opts) {
    return fetch(SB + "/rest/v1/" + path, opts).then(function (r) {
      return r.text().then(function (t) {
        var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok) throw new Error((j && (j.message || j.hint)) || "Errore di rete, riprova");
        return j;
      });
    });
  }
  function rpc(fn, args) { return api("rpc/" + fn, { method: "POST", headers: HEAD, body: JSON.stringify(args || {}) }); }
  function get(path) { return api(path, { headers: HEAD }); }

  var toastT;
  function toast(msg) { if (msg !== "Salvato" && msg !== "Profilo creato") play("err"); var t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("on"); }, 1600); }

  function fmtWhen(iso) {
    return new Date(iso).toLocaleString("it-IT", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Rome" });
  }
  function outcome(h, a) { return h > a ? 1 : h < a ? -1 : 0; }

  /* ---------- login ---------- */
  function showLogin() {
    $("loading").hidden = true; $("appView").hidden = true; $("who").hidden = true; $("loginView").hidden = false;
  }
  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("nameIn").value.trim(), pin = $("pinIn").value.trim();
    $("loginErr").textContent = ""; $("loginBtn").disabled = true;
    rpc("ble_join_game", { p_name: name, p_pin: pin }).then(function (r) {
      state.me = { name: r.name, pin: pin };
      store("ble.me", JSON.stringify(state.me));
      play("join");
      if (r.created) toast("Profilo creato");
      boot();
    }).catch(function (err) { $("loginErr").textContent = err.message; })
      .then(function () { $("loginBtn").disabled = false; });
  });
  $("logout").addEventListener("click", function () { store("ble.me", null); state.me = null; $("pinIn").value = ""; showLogin(); });

  /* ---------- boot ---------- */
  function boot() {
    $("loginView").hidden = true; $("loading").hidden = false; $("loading").textContent = "Carico il gioco…";
    get("ble_matchdays?select=n&order=n.asc").then(function (rows) {
      state.mds = rows.map(function (r) { return r.n; });
      if (!state.mds.length) { $("loading").textContent = "Nessuna giornata disponibile per ora. Torna presto."; return; }
      return get("ble_matches?select=matchday,kickoff,status&order=kickoff.asc").then(function (all) {
        var now = Date.now(), pick = state.mds[state.mds.length - 1];
        for (var i = 0; i < state.mds.length; i++) {
          var n = state.mds[i];
          var ms = all.filter(function (m) { return m.matchday === n; });
          if (ms.some(function (m) { return m.status !== "finished" && new Date(m.kickoff).getTime() > now - 3 * 3600e3; })) { pick = n; break; }
        }
        state.md = pick;
        $("who").hidden = false; $("whoName").textContent = state.me.name;
        $("loading").hidden = true; $("appView").hidden = false;
        return loadMd();
      });
    }).catch(function (err) { $("loading").hidden = false; $("loading").textContent = err.message; });
  }

  function loadMd() {
    var n = state.md;
    $("mdTitle").innerHTML = "<span class='md-l'>Giornata</span><span class='md-n'>" + n + "</span><small id='mdSub'></small>";
    var i = state.mds.indexOf(n);
    $("prevMd").disabled = i <= 0; $("nextMd").disabled = i >= state.mds.length - 1;
    $("playPane").innerHTML = "<p class='empty'>Carico le partite…</p>";
    return Promise.all([
      get("ble_matches?select=*,questions:ble_questions(*)&matchday=eq." + n + "&order=kickoff.asc,id.asc"),
      rpc("ble_my_picks", { p_name: state.me.name, p_pin: state.me.pin, p_matchday: n }),
      rpc("ble_rev_pred", { p_matchday: n }),
      rpc("ble_rev_ans", { p_matchday: n })
    ]).then(function (r) {
      if (n !== state.md) return;
      state.matches = r[0];
      state.preds = {}; state.ans = {};
      r[1].predictions.forEach(function (p) { state.preds[p.match_id] = { h: p.home_goals, a: p.away_goals }; });
      r[1].answers.forEach(function (a) { state.ans[a.question_id] = a.answer; });
      state.revP = r[2]; state.revA = r[3];
      var first = state.matches[0];
      var sub = $("mdSub"); if (sub && first) sub.textContent = fmtWhen(first.kickoff).replace(/,.*$/, "") ;
      renderPlay();
      if (state.tab === "rank") renderRank();
    }).catch(function (err) {
      if (/Nome o PIN/.test(err.message)) { store("ble.me", null); showLogin(); return; }
      $("playPane").innerHTML = "<p class='empty'>" + esc(err.message) + "</p>";
    });
  }

  /* ---------- play ---------- */
  function stepperHtml(side, val, locked) {
    return "<div class='stepper' data-side='" + side + "'>" +
      "<button type='button' data-d='-1' aria-label='Meno gol'" + (locked ? " disabled" : "") + ">&minus;</button>" +
      "<output>" + (val === null || val === undefined ? "–" : val) + "</output>" +
      "<button type='button' data-d='1' aria-label='Più gol'" + (locked ? " disabled" : "") + ">+</button></div>";
  }

  function matchPoints(m) {
    var got = 0, p = state.preds[m.id];
    if (m.status === "finished" && p) {
      if (outcome(p.h, p.a) === outcome(m.home_goals, m.away_goals)) got += 3;
      if (p.h === m.home_goals && p.a === m.away_goals) got += 2;
    }
    (m.questions || []).forEach(function (q) {
      if (q.correct && q.correct !== "void" && state.ans[q.id] === q.correct) got += q.points;
    });
    return got;
  }

  function isComplete(m) {
    var p = state.preds[m.id];
    if (!p || p.h === null || p.a === null || p.h === undefined || p.a === undefined) return false;
    return (m.questions || []).every(function (q) { return !!state.ans[q.id]; });
  }

  function shortWhen(iso) {
    return new Date(iso).toLocaleString("it-IT", { weekday: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Rome" });
  }

  function chipsHtml() {
    return "<div class='chips'>" + state.matches.map(function (m) {
      return "<button type='button' class='mchip ko' data-sel='" + m.id + "' aria-pressed='" + (m.id === state.sel) + "'>" +
        "<b>" + esc(m.home) + " &ndash; " + esc(m.away) + "</b><small></small></button>";
    }).join("") + "</div>";
  }

  var wasDone = {};
  function refreshChips(quiet) {
    var done = 0;
    state.matches.forEach(function (m) {
      var ok = isComplete(m); if (ok) done++;
      if (ok && !wasDone[m.id] && !quiet) play("done");
      wasDone[m.id] = ok;
      var el = document.querySelector(".mchip[data-sel='" + m.id + "']");
      if (!el) return;
      el.classList.toggle("ok", ok); el.classList.toggle("ko", !ok);
      el.querySelector("small").textContent = shortWhen(m.kickoff) + " · " + (ok ? "completa" : "da fare");
    });
    var pr = $("progress");
    if (pr) pr.textContent = done + " di " + state.matches.length + " partite complete";
  }

  function cardHtml(m) {
    var now = Date.now();
    var started = new Date(m.kickoff).getTime() <= now, fin = m.status === "finished";
    var p = state.preds[m.id] || { h: null, a: null };
    var badge = fin ? "<span class='pill done'>Finita</span>" : started ? "<span class='pill live'>In corso</span>" : "<span class='pill'>Aperta</span>";
    var qs = (m.questions || []).slice().sort(function (a, b) { return a.id - b.id; });
    var html = "<article class='card' data-m='" + m.id + "'>" +
      "<div class='when'><span>" + esc(fmtWhen(m.kickoff)) + "</span>" + badge + "</div>" +
      "<div class='score'><div class='team'>" + esc(m.home) + "</div>" +
      "<div class='goals'>" + stepperHtml("h", p.h, started) + "<span class='dash'>:</span>" + stepperHtml("a", p.a, started) + "</div>" +
      "<div class='team away'>" + esc(m.away) + "</div></div>";
    if (fin) html += "<div class='final'><span>Risultato</span><b>" + m.home_goals + " &ndash; " + m.away_goals + "</b>" + pointsBadge(matchPoints(m)) + "</div>";
    html += qs.map(function (q) {
      var done = q.correct !== null && q.correct !== undefined;
      return "<div class='q' data-q='" + q.id + "'><p><span>" + esc(q.prompt) + "</span><em>" + (q.correct === "void" ? "annullata" : "+" + q.points) + "</em></p><div class='opts'>" +
        q.options.map(function (o) {
          var on = state.ans[q.id] === o.k;
          var right = done && q.correct === o.k;
          return "<button type='button' data-k='" + esc(o.k) + "' aria-pressed='" + on + "' class='" + (right ? "right" : "") + "'" + (started ? " disabled" : "") + ">" + esc(o.label) + "</button>";
        }).join("") + "</div></div>";
    }).join("");
    if (started) html += others(m, qs);
    else html += "<p class='lock'>Puoi cambiare fino al calcio d'inizio.</p>";
    return html + "</article>";
  }

  function renderPlay() {
    var box = $("playPane");
    if (!state.matches.length) { box.innerHTML = "<p class='empty'>Questa giornata non ha ancora partite.</p>"; return; }
    var cur = state.matches.filter(function (m) { return m.id === state.sel; })[0];
    if (!cur) {
      var now = Date.now();
      cur = state.matches.filter(function (m) { return new Date(m.kickoff).getTime() > now && !isComplete(m); })[0] || state.matches[0];
      state.sel = cur.id;
    }
    box.innerHTML = "<p class='progress' id='progress'></p>" + chipsHtml() +
      "<div id='cardBox'>" + cardHtml(cur) + "</div>" +
      "<p class='rules'><b>Punteggio</b> &ndash; esito 1X2 giusto: 3 punti. Risultato esatto: altri 2. Ogni domanda extra: i punti indicati.</p>";
    refreshChips(true);
  }

  function pointsBadge(n) { return "<span class='got" + (n ? "" : " zero") + "'>" + (n ? "+" + n + " punti" : "0 punti") + "</span>"; }

  function others(m, qs) {
    var rows = state.revP.filter(function (r) { return r.match_id === m.id; });
    if (!rows.length) return "<p class='lock'>Nessun pronostico inserito prima del via.</p>";
    var byName = {};
    rows.forEach(function (r) { byName[r.pname] = { s: r.hg + "–" + r.ag, x: [] }; });
    qs.forEach(function (q) {
      state.revA.filter(function (r) { return r.question_id === q.id; }).forEach(function (r) {
        if (!byName[r.pname]) byName[r.pname] = { s: "–", x: [] };
        var opt = q.options.filter(function (o) { return o.k === r.ans; })[0];
        byName[r.pname].x.push(opt ? opt.label : r.ans);
      });
    });
    return "<details class='others'><summary>Cosa hanno detto gli altri</summary><ul>" +
      Object.keys(byName).map(function (nm) {
        return "<li><span>" + esc(nm) + " <b>" + esc(byName[nm].s) + "</b></span><span>" + esc(byName[nm].x.join(" · ")) + "</span></li>";
      }).join("") + "</ul></details>";
  }

  var saving = {};
  $("playPane").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.hasAttribute("data-sel")) {
      state.sel = +b.getAttribute("data-sel");
      play("chip");
      renderPlay();
      var cb = $("cardBox");
      if (cb && cb.scrollIntoView) cb.scrollIntoView({ block: "start", behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      return;
    }
    var card = b.closest("article.card"); if (!card) return;
    var mid = +card.getAttribute("data-m");
    if (b.hasAttribute("data-d")) {
      var side = b.parentNode.getAttribute("data-side");
      var p = state.preds[mid] || { h: null, a: null };
      var cur = { h: p.h === null ? 0 : p.h, a: p.a === null ? 0 : p.a };
      cur[side] = Math.max(0, Math.min(20, cur[side] + (+b.getAttribute("data-d"))));
      play(+b.getAttribute("data-d") > 0 ? "up" : "down");
      state.preds[mid] = cur;
      refreshChips();
      var outs = card.querySelectorAll(".stepper output");
      outs[0].textContent = cur.h; outs[1].textContent = cur.a;
      clearTimeout(saving[mid]);
      saving[mid] = setTimeout(function () {
        rpc("ble_save_prediction", { p_name: state.me.name, p_pin: state.me.pin, p_match: mid, p_home: cur.h, p_away: cur.a })
          .then(function () { toast("Salvato"); }).catch(function (err) { toast(err.message); loadMd(); });
      }, 350);
    } else if (b.hasAttribute("data-k")) {
      var qEl = b.closest(".q"), qid = +qEl.getAttribute("data-q"), k = b.getAttribute("data-k");
      state.ans[qid] = k;
      play("pick");
      refreshChips();
      qEl.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      rpc("ble_save_answer", { p_name: state.me.name, p_pin: state.me.pin, p_question: qid, p_answer: k })
        .then(function () { toast("Salvato"); }).catch(function (err) { toast(err.message); loadMd(); });
    }
  });

  /* ---------- classifica ---------- */
  function renderRank() {
    var box = $("rankPane");
    box.innerHTML = "<div class='scope'><button type='button' data-s='md' aria-pressed='" + (state.scope === "md") + "'>Giornata " + state.md + "</button><button type='button' data-s='all' aria-pressed='" + (state.scope === "all") + "'>Generale</button></div><div id='rankList'><p class='empty'>Carico la classifica…</p></div>";
    rpc("ble_leaderboard", { p_matchday: state.scope === "md" ? state.md : null }).then(function (rows) {
      var list = $("rankList"); if (!list) return;
      if (!rows.length) { list.innerHTML = "<p class='empty'>Ancora nessun giocatore.</p>"; return; }
      list.innerHTML = "<ol class='rank'>" + rows.map(function (r, i) {
        return "<li class='" + (r.pname.toLowerCase() === state.me.name.toLowerCase() ? "me" : "") + "'><span class='pos'>" + (i + 1) + "</span>" +
          "<span class='nm'>" + esc(r.pname) + "<span class='det'>" + r.n_outcomes + " esiti &middot; " + r.n_exact + " esatti &middot; " + r.n_bonus + " extra</span></span>" +
          "<span class='pts'>" + r.pts + "</span></li>";
      }).join("") + "</ol>";
    }).catch(function (err) { var l = $("rankList"); if (l) l.innerHTML = "<p class='empty'>" + esc(err.message) + "</p>"; });
  }
  $("rankPane").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-s]"); if (!b) return;
    state.scope = b.getAttribute("data-s"); renderRank();
  });

  function setTab(t) {
    if (state.tab !== t) play("chip");
    state.tab = t;
    $("tabPlay").setAttribute("aria-selected", t === "play"); $("tabRank").setAttribute("aria-selected", t === "rank");
    $("playPane").hidden = t !== "play"; $("rankPane").hidden = t !== "rank";
    if (t === "rank") renderRank();
  }
  $("tabPlay").addEventListener("click", function () { setTab("play"); });
  $("tabRank").addEventListener("click", function () { setTab("rank"); });
  $("prevMd").addEventListener("click", function () { var i = state.mds.indexOf(state.md); if (i > 0) { state.md = state.mds[i - 1]; loadMd(); } });
  $("nextMd").addEventListener("click", function () { var i = state.mds.indexOf(state.md); if (i < state.mds.length - 1) { state.md = state.mds[i + 1]; loadMd(); } });

  /* ---------- start ---------- */
  var saved = null;
  try { saved = JSON.parse(store("ble.me") || "null"); } catch (e) {}
  if (saved && saved.name && saved.pin) { state.me = saved; boot(); } else { showLogin(); }
})();
</script>
